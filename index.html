<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<title>Plot Logbook</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <main>
    <section class="view" data-view="map">
      <div id="map"></div>
      <div class="map-top">
        <button class="pill" id="sync-pill" title="Sync status"><span class="dot" id="sync-dot"></span><span id="sync-text">offline</span></button>
        <span class="spacer"></span>
        <button class="pill icon" id="btn-list" title="Find a feature" aria-label="Find a feature"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></svg></button>
        <button class="pill icon" id="btn-locate" title="Where am I">◎</button>
        <button class="pill icon" id="btn-layers" title="Layers">≡</button>
      </div>
      <div class="draw-bar" id="pick-bar" hidden>
        <div class="draw-info"><button class="snap" aria-pressed="false" hidden>⊞ Snap</button><strong id="pick-title">Tap the map</strong></div>
        <div class="row"><button class="btn" id="pick-cancel">Cancel</button></div>
      </div>
      <div class="draw-bar" id="shape-bar" hidden>
        <div class="draw-info"><button class="snap" aria-pressed="false" hidden>⊞ Snap</button><strong id="shape-title">Shaping</strong> <span id="shape-summary"></span></div>
        <div class="row">
          <button class="btn" id="shape-gps" title="Add a point, or put the selected one, at my GPS position">◎ Here</button>
          <button class="btn" id="shape-length" title="Set the length of the side that ends at the selected point">Length…</button>
          <button class="btn" id="shape-remove">✕ Remove</button>
          <button class="btn" id="shape-swap" title="Swap which end is A">⇄ A/B</button>
        </div>
        <div class="row">
          <button class="btn" id="shape-undo">↶ Undo</button>
          <button class="btn" id="shape-restart" title="Take every point away and draw it afresh (↶ Undo brings them back)">Start again</button>
          <button class="btn primary" id="shape-save">Save</button>
          <button class="btn" id="shape-cancel">Cancel</button>
        </div>
        <div class="note" id="shape-note"></div>
      </div>
      <div class="map-bottom">
        <div class="jobs-strip" id="jobs-strip" hidden></div>
        <button class="fab" id="btn-add" title="Log something here">+</button>
      </div>
    </section>
    <section class="view" data-view="jobs" hidden><div id="jobs-view"></div></section>
    <section class="view" data-view="water" hidden><div id="water-view"></div></section>
    <section class="view" data-view="photos" hidden><div id="photos-view"></div></section>
    <section class="view" data-view="more" hidden><div id="more-view"></div></section>
    <div class="sheet layers" id="layers-sheet">
      <div class="grip"></div><button class="close" data-close>×</button>
      <h2>Layers</h2>
      <div class="sub see-through"><span class="note">See through this panel</span> <input type="range" id="sheet-opacity" min="0.2" max="1" step="0.05" value="1"></div>
      <details class="grp" id="grp-general" open>
        <summary>General</summary>
        <label><input type="checkbox" data-layer="ortho" checked> Satellite</label>
        <div class="sub"><span class="note">Satellite opacity</span> <input type="range" id="ortho-opacity" min="0" max="1" step="0.05" value="0.85"></div>
        <label><input type="checkbox" data-layer="labels" checked> Labels</label>
        <label><input type="checkbox" data-layer="csg"> Cadastral polygon (CSG)</label>
        <label><input type="checkbox" data-layer="sg"> Survey diagram + river-middle line</label>
        <label><input type="checkbox" data-layer="context"> Neighbouring parcels and streets</label>
      </details>
      <details class="grp" id="grp-grid" open>
        <summary>Grid</summary>
        <label><input type="checkbox" data-layer="grid"> Grid</label>
        <div class="sub"><span class="note">Square size</span> <input type="range" id="grid-size" min="1" max="10" step="1" value="5"> <span id="grid-size-val">5 m</span></div>
        <div class="sub note" id="grid-note"></div>
      </details>
      <details class="grp" id="grp-features" open>
        <summary>Features</summary>
        <label><input type="checkbox" data-layer="planned" checked> Planned (not built yet)</label>
        <label class="all"><input type="checkbox" id="cat-all" checked> All features</label>
        <div id="layer-categories"></div>
      </details>
    </div>
    <div class="sheet" id="feature-sheet">
        <div class="grip"></div><button class="close" data-close>×</button>
        <div id="feature-body"></div>
      </div>
  </main>
  <nav class="tabs">
    <button data-tab="map" class="active"><span class="ico">🗺</span>Map</button>
    <button data-tab="jobs"><span class="ico">☑</span>Jobs</button>
    <button data-tab="water"><span class="ico">💧</span>Water</button>
    <button data-tab="photos"><span class="ico">📷</span>Photos</button>
    <button data-tab="more"><span class="ico">⋯</span>More</button>
  </nav>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/fflate.js"></script>
<script src="vendor/exifr.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
